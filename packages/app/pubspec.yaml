name: dextero_app
description: Flutter desktop client for the local Dextero server.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  dextero_server:
    path: ../server
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
